<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Painel do casamento</title>
<style>
  *{box-sizing:border-box}
  body{font-family:system-ui,Arial,sans-serif;background:#f4f3ee;color:#1f3a2b;margin:0;padding:24px}
  h1{font-size:28px;margin:0 0 20px}
  h2{font-size:20px;margin:36px 0 10px}
  .caixa-login{max-width:380px;margin:80px auto;background:#fff;padding:36px;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
  label{display:block;margin-bottom:16px;font-size:15px}
  input{width:100%;padding:12px;font-size:16px;margin-top:6px;border:1px solid #bfc9bb;border-radius:4px}
  button{width:100%;padding:13px;font-size:16px;background:#5f7d68;color:#fff;border:0;border-radius:4px;cursor:pointer;margin-top:6px}
  button:disabled{opacity:.6;cursor:default}
  .erro{color:#a33;margin-bottom:14px}
  #painel{display:none;max-width:1000px;margin:0 auto}
  .topo{display:flex;justify-content:space-between;align-items:center}
  a.sair{color:#5f7d68;text-decoration:none;font-size:14px;cursor:pointer}
  .resumo{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:10px}
  .cartao{background:#fff;border-radius:8px;padding:18px 22px;min-width:180px;box-shadow:0 4px 14px rgba(0,0,0,.06)}
  .cartao strong{display:block;font-size:26px;margin-top:4px}
  table{width:100%;border-collapse:collapse;background:#fff;border-radius:8px;overflow:hidden;margin-bottom:10px;font-size:14px}
  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid #eee}
  th{background:#ebede6}
  .status-aprovado{color:#2a6b3f;font-weight:600}
  .status-recusado{color:#a33;font-weight:600}
  .vazio{color:#777;padding:14px}
  .config{max-width:420px;margin:80px auto;background:#fff;padding:30px;border-radius:8px;text-align:center}
  .btn-excluir{background:none;border:1px solid #d8a9a9;color:#a33;width:28px;height:28px;border-radius:50%;font-size:15px;line-height:1;cursor:pointer;padding:0}
  .btn-excluir:hover{background:#a33;color:#fff}
  .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);align-items:center;justify-content:center;z-index:10}
  .overlay.aberto{display:flex}
  .modal{background:#fff;max-width:360px;width:90%;padding:26px;border-radius:8px;text-align:center}
  .modal p{margin:0 0 20px;font-size:15px;line-height:1.5}
  .modal .acoes{display:flex;gap:10px}
  .modal .acoes button{width:auto;flex:1;margin-top:0}
  .btn-cancelar{background:#e4e6e0!important;color:#1f3a2b!important}
</style>
</head>
<body>

<div class="caixa-login" id="tela-login">
  <h1>Painel do casamento</h1>
  <p class="erro" id="erro-login"></p>
  <form id="form-login">
    <label>Usuário<input type="text" id="usuario" autocomplete="username" autofocus required></label>
    <label>Senha<input type="password" id="senha" autocomplete="current-password" required></label>
    <button type="submit" id="botao-entrar">Entrar</button>
  </form>
</div>

<div id="painel">
  <div class="topo"><h1>Painel do casamento</h1><a class="sair" id="sair">Sair</a></div>
  <div class="resumo">
    <div class="cartao">Pessoas confirmadas<strong id="r-pessoas">0</strong></div>
    <div class="cartao">Já recebido<strong id="r-recebido">R$ 0</strong></div>
  </div>

  <h2>Confirmações de presença</h2>
  <table><thead><tr><th>Data</th><th>Nome</th><th>Vai?</th><th>Pessoas</th><th>Recado</th><th></th></tr></thead>
    <tbody id="tabela-confirmacoes"></tbody></table>

  <h2>Pagamentos de presentes</h2>
  <table><thead><tr><th>Data</th><th>Itens</th><th>Valor</th><th>Status</th><th>Nome do convidado</th><th>Mensagem</th><th>Pagador (MP)</th><th>E-mail</th></tr></thead>
    <tbody id="tabela-pagamentos"></tbody></table>
</div>

<div class="overlay" id="overlay-excluir">
  <div class="modal">
    <p>Remover a confirmação de <strong id="nome-excluir"></strong>?<br>Essa ação não pode ser desfeita.</p>
    <div class="acoes">
      <button class="btn-cancelar" id="cancelar-excluir" type="button">Cancelar</button>
      <button id="confirmar-excluir" type="button">Remover</button>
    </div>
  </div>
</div>

<script>
// Cole aqui a mesma URL do Worker que está no index.html do site (CASAMENTO.backendUrl).
const BACKEND_URL = "https://casamento-backend.ddcampell.workers.dev";

const brl = v => 'R$ ' + Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2});
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const telaLogin = document.getElementById('tela-login');
const painel = document.getElementById('painel');
let credenciais = null; // guarda usuario/senha depois do login, para poder excluir depois

if(!BACKEND_URL){
  telaLogin.outerHTML = '<div class="config"><h1>Painel ainda não configurado</h1><p>Abra este arquivo (admin/index.html) e cole a URL do backend na constante <code>BACKEND_URL</code>, no topo do script.</p></div>';
} else {
  document.getElementById('form-login').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const usuario = document.getElementById('usuario').value;
    const senha = document.getElementById('senha').value;
    const erro = document.getElementById('erro-login');
    const botao = document.getElementById('botao-entrar');
    erro.textContent = ''; botao.disabled = true; botao.textContent = 'Entrando…';
    try{
      const resp = await fetch(BACKEND_URL + '/admin-api', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({usuario, senha})
      });
      const dados = await resp.json();
      if(!resp.ok || !dados.ok){ throw new Error(dados.erro || 'Não foi possível entrar.'); }
      credenciais = {usuario, senha};
      mostrarPainel(dados);
    }catch(err){
      erro.textContent = err.message || 'Usuário ou senha incorretos.';
    }finally{
      botao.disabled = false; botao.textContent = 'Entrar';
    }
  });
}

function mostrarPainel(dados){
  telaLogin.style.display = 'none';
  painel.style.display = 'block';

  document.getElementById('r-pessoas').textContent = dados.resumo.pessoasConfirmadas;
  document.getElementById('r-recebido').textContent = brl(dados.resumo.totalAprovado);

  const tConf = document.getElementById('tabela-confirmacoes');
  tConf.innerHTML = dados.confirmacoes.length ? dados.confirmacoes.map(c=>`<tr>
      <td>${esc(c.criado_em)}</td><td>${esc(c.nome)}</td><td>${esc(c.vai)}</td>
      <td>${esc(c.pessoas)}</td><td>${esc(c.mensagem||'')}</td>
      <td><button class="btn-excluir" type="button" data-id="${esc(c.id)}" data-nome="${esc(c.nome)}" title="Remover">✕</button></td></tr>`).join('')
    : '<tr><td colspan="6" class="vazio">Nenhuma confirmação ainda.</td></tr>';

  const tPag = document.getElementById('tabela-pagamentos');
  const pagamentos = dados.pagamentos.filter(p => p.status !== 'pendente');
  tPag.innerHTML = pagamentos.length ? pagamentos.map(p=>`<tr>
      <td>${esc(p.criado_em)}</td><td>${esc(p.itens)}</td><td>${brl(p.valor)}</td>
      <td class="status-${esc(p.status)}">${esc(p.status)}</td>
      <td>${esc(p.convidado_nome||'')}</td><td>${esc(p.mensagem||'')}</td>
      <td>${esc(p.pagador_nome||'')}</td><td>${esc(p.pagador_email||'')}</td></tr>`).join('')
    : '<tr><td colspan="8" class="vazio">Nenhum pagamento ainda.</td></tr>';

  tConf.querySelectorAll('.btn-excluir').forEach(btn=>{
    btn.addEventListener('click', ()=> abrirExclusao(btn.dataset.id, btn.dataset.nome));
  });
}

/* ---------------- excluir confirmação (com caixinha de confirmação) ---------------- */
const overlayExcluir = document.getElementById('overlay-excluir');
let idParaExcluir = null;

function abrirExclusao(id, nome){
  idParaExcluir = id;
  document.getElementById('nome-excluir').textContent = nome || 'este convidado';
  overlayExcluir.classList.add('aberto');
}
function fecharExclusao(){
  idParaExcluir = null;
  overlayExcluir.classList.remove('aberto');
}
document.getElementById('cancelar-excluir').addEventListener('click', fecharExclusao);
overlayExcluir.addEventListener('click', (e)=>{ if(e.target === overlayExcluir) fecharExclusao(); });

document.getElementById('confirmar-excluir').addEventListener('click', async ()=>{
  if(!idParaExcluir || !credenciais) return;
  const botao = document.getElementById('confirmar-excluir');
  botao.disabled = true; botao.textContent = 'Removendo…';
  try{
    const resp = await fetch(BACKEND_URL + '/admin-api', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({...credenciais, acao:'excluir_confirmacao', id:idParaExcluir})
    });
    const dados = await resp.json();
    if(!resp.ok || !dados.ok) throw new Error(dados.erro || 'Não foi possível remover.');
    fecharExclusao();
    // busca os dados atualizados para o resumo (pessoas confirmadas) ficar certo
    const resp2 = await fetch(BACKEND_URL + '/admin-api', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(credenciais)
    });
    const dados2 = await resp2.json();
    if(resp2.ok && dados2.ok) mostrarPainel(dados2);
  }catch(err){
    alert(err.message || 'Não foi possível remover a confirmação.');
  }finally{
    botao.disabled = false; botao.textContent = 'Remover';
  }
});

document.getElementById('sair')?.addEventListener('click', ()=>location.reload());
</script>
</body>
</html>
